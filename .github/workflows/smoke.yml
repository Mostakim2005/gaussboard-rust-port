name: Editor smoke
on:
  push:
    branches: ['**']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run 24/24 Active Features Smoke Suite
        run: npm run smoke:new
      - name: Verify 100% 7-Locale i18n Parity
        run: npm run i18n:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaussBoard-Rust-smoke
          path: test/out/
          retention-days: 7
