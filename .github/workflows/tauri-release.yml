name: tauri-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and deduplicate by commit SHA
        id: scan
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          node - << 'EOF'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');

          const rawBranches = execSync("git for-each-ref --format='%(refname:short)|%(objectname)|%(objectname:short=7)' refs/remotes/origin/", { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean);

          const bySha = new Map();
          for (const line of rawBranches) {
            const [ref, fullSha, shortSha] = line.split('|');
            if (!ref || ref === 'origin/HEAD' || ref === 'origin') continue;
            const branch = ref.replace(/^origin\//, '');

            try {
              execSync(`git cat-file -e ${fullSha}:src-tauri/Cargo.toml`, { stdio: 'ignore' });
            } catch {
              console.log(`Skipping branch ${branch} (${shortSha}): no src-tauri/Cargo.toml`);
              continue;
            }

            let version = '0.0.0';
            try {
              const pkgRaw = execSync(`git show ${fullSha}:package.json`, { encoding: 'utf8' });
              version = JSON.parse(pkgRaw).version || '0.0.0';
            } catch {}

            if (!bySha.has(fullSha)) {
              bySha.set(fullSha, {
                branches: [branch],
                full_sha: fullSha,
                short_sha: shortSha,
                version
              });
            } else {
              bySha.get(fullSha).branches.push(branch);
            }
          }

          const items = Array.from(bySha.values()).map((entry) => {
            entry.branches.sort((a, b) => (a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b)));
            const joinedBranch = entry.branches.join('+');
            const slug = entry.branches
              .map((b) => b.replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, ''))
              .join('-and-');
            return {
              branch: joinedBranch,
              slug,
              full_sha: entry.full_sha,
              short_sha: entry.short_sha,
              version: entry.version
            };
          });

          const summary = items.map((i) => `${i.branch}@${i.short_sha}`).join(', ');
          const matrixObj = { include: items };
          console.log('Discovered deduplicated Rust/Tauri branches:', matrixObj);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrixObj)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${summary}\n`);
          EOF

  build-tauri-windows:
    needs: [discover-branches]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-branches.outputs.matrix) }}
    steps:
      - name: Checkout branch (${{ matrix.branch }} @ ${{ matrix.short_sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.full_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Rename binaries with Engine, Version, Branch, and Commit SHA
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          SLUG: ${{ matrix.slug }}
          SHA: ${{ matrix.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          PREFIX="GaussBoard-Rust-Tauri-v${VERSION}-branch-${SLUG}-${SHA}"

          if [ -f "src-tauri/target/release/gaussboard.exe" ]; then
            cp "src-tauri/target/release/gaussboard.exe" "dist-release/${PREFIX}-Portable.exe"
          fi

          NSIS_EXE="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' 2>/dev/null | head -n 1 || true)"
          if [ -n "$NSIS_EXE" ]; then
            cp "$NSIS_EXE" "dist-release/${PREFIX}-Setup.exe"
          fi

          MSI_FILE="$(find src-tauri/target/release/bundle/msi -maxdepth 1 -name '*.msi' 2>/dev/null | head -n 1 || true)"
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" "dist-release/${PREFIX}-x64.msi"
          fi

          ls -lh dist-release/

      - name: Upload Windows artifacts (${{ matrix.slug }})
        uses: actions/upload-artifact@v4
        with:
          name: GaussBoard-Rust-Tauri-Windows-${{ matrix.slug }}-${{ matrix.short_sha }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach branch binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GaussBoard [Rust-Tauri] ${{ github.ref_name }} (Branches: ${{ needs.discover-branches.outputs.summary }})"
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
