name: tauri-android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager "ndk;27.0.11902837" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Inspect generated BuildTask
        run: |
          find src-tauri/gen/android -name "BuildTask.kt" -exec cat {} +

      - name: Build Tauri Android APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Sign Android APK
        run: |
          echo "--- Generating signing keystore ---"
          keytool -genkey -v -keystore release.keystore -alias gaussboard -keyalg RSA -keysize 2048 -validity 10000 -storepass gaussboard -keypass gaussboard -dname "CN=GaussBoard, OU=Engineering, O=theBoringCodes, L=City, S=State, C=US"
          
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          mkdir -p dist-apk
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Signing $apk -> dist-apk/GaussBoard-1.0.0-arm64.apk"
            $APKSIGNER sign --ks release.keystore --ks-pass pass:gaussboard --key-pass pass:gaussboard --out dist-apk/GaussBoard-1.0.0-arm64.apk "$apk"
            break
          done
          
          echo "--- Verifying signature ---"
          $APKSIGNER verify -v dist-apk/GaussBoard-1.0.0-arm64.apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GaussBoard-Rust-Android-APK
          path: |
            dist-apk/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
