[package]
name = "gaussboard"
version = "7.0.1"
edition = "2021"

[lib]
name = "gaussboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
x25519-dalek = { version = "2.0", features = ["static_secrets", "reusable_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
tempfile = "3.13"
parking_lot = "0.12"
url = "2.5"
mime_guess = "2.0"
percent-encoding = "2.3"
hostname = "0.4"
walkdir = "2.5"
include_dir = "0.7"

# Native Archive & Streaming Compression
zip = { version = "2.2", default-features = false, features = ["deflate", "zstd"] }

# Embedded Search & Knowledge Graph Engine
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Fast Audio Duration & Metadata
symphonia = { version = "0.5.4", features = ["all"] }

# Stroke Geometry & Curve Fitting
kurbo = { version = "0.11", features = ["serde"] }

# PDF Text Extraction & Page Indexing (100% Pure Rust)
pdf-extract = "0.12"

# Perceptual Colorimetry, Oklch Mixing & WCAG 2.1 Contrast
palette = { version = "0.7", default-features = false, features = ["std", "serializing"] }

# Linear-Time CommonMark & Math/Table Document Parser
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Zero-Copy Struct Casting & Concurrency Channels
bytemuck = { version = "1.18", features = ["derive"] }
crossbeam-channel = "0.5"

# Pure-Rust Audio DSP Denoising (Neural RNNoise in Safe Rust)
nnnoiseless = "0.5"

# Pure-Rust SIMD 2D Rasterizer & Streaming PNG Encoder for 16K Tiled Exports
tiny-skia = { version = "0.11", default-features = false, features = ["simd", "std"] }
png = "0.17"

# Desktop-only plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.2"
tauri-plugin-global-shortcut = "2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange"
] }
webview2-com = "0.39"
