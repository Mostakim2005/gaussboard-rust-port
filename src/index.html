<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#6264a7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app: data: blob:; script-src 'self' app: 'wasm-unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob: https://img.youtube.com https://i.ytimg.com; font-src 'self' app: data:; connect-src 'self' app: blob: data: https://api.github.com https://github.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://www.youtube.com https://www.youtube-nocookie.com https://img.youtube.com https://i.ytimg.com; media-src 'self' app: data: blob: https: file:; frame-src 'self' app: data: blob: https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' app: blob:; manifest-src 'self';">
<title>GaussBoard</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<script src="./js/errors.js"></script>
<script type="module" src="./js/platform/platform.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn" id="btnBoards" title="My boards"></button>
    <input id="boardTitle" value="Untitled board" spellcheck="false" aria-label="Board name">
    <button class="tb-btn tb-props-btn" id="btnProperties" title="Board Properties (Tags & Aliases)" style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:12px;margin-left:4px;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <span>Properties</span>
    </button>
    <div id="topPropertiesChips" class="top-props-chips" style="display:inline-flex;align-items:center;gap:4px;margin-left:4px;"></div>
    <button class="tb-btn tb-audio-rec" id="btnTopRecord" title="Record Audio Replay" style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:14px;font-size:12px;font-weight:600;margin-left:6px;cursor:pointer;transition:all 0.2s;">
      <span class="rec-dot" style="width:8px;height:8px;border-radius:50%;background:#e53e3e;display:inline-block;"></span>
      <span id="topRecTime">Record</span>
    </button>
    <button class="tb-btn tb-omni-search" id="btnOmniSearch" title="Search Boards & Settings (Ctrl+K)" style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:12px;margin-left:4px;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="tb-btn tb-sidebar-ribbon" id="btnSidebarRibbon" title="Engineering and STEM Ribbon (Ctrl+B)" style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:12px;margin-left:4px;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Workbench</span>
    </button>
    <button class="tb-btn tb-workflow-studio" id="btnWorkflowStudio" title="Workflow Studio, UI Style & Hide Controls (Ctrl+Shift+O)" aria-expanded="false"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Studio</span></button>
    <span class="badge" id="savedBadge">Saved</span>
    <button class="badge" id="storageWarning" type="button" hidden></button>
    <!-- Shown when other boards link to this one: a click lists them. -->
    <button class="badge" id="linkedFrom" type="button" hidden></button>
    <div class="spacer"></div>
    <button class="tb-btn" id="btnTemplates" title="Templates"></button>
    <button class="tb-btn" id="btnBackground" title="Canvas"></button>
    <button class="tb-btn" id="btnExport" title="Export"></button>
    <button class="tb-btn" id="btnPresent" title="Present (F5) — the board fills the screen; Esc to finish"></button>
    <!-- Shown only while a board is on its way in. It sits in the flow of the
         top bar rather than over the canvas, so it can never cover ink. -->
    <div id="rxBadge">
      <span class="rx-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100"></span>
      <span class="rx-label"></span>
    </div>
    <button class="tb-btn" id="btnShare" title="Share on this network"></button>
    <button class="tb-btn" id="btnSettings" title="Settings"></button>
    <button class="tb-btn" id="btnHelp" title="Keyboard shortcuts"></button>
  </header>

  <main id="stage">
    <canvas id="c"></canvas>
    <!-- The ink pointer. A layer of its own so moving it is a compositor
         transform rather than a repaint of the board - see showInkPointer(). -->
    <div id="inkNib" hidden></div>
    <div id="editLayer"></div>

    <div id="ctxbar"></div>

    <!-- built in js/ui/toolbar.js so the pen tray is data-driven -->
    <nav id="toolbar" role="toolbar" aria-label="Whiteboard tools"></nav>

    <div id="pagebar" hidden>
      <button data-page="prev" title="Previous page (Page Up)"></button>
      <button id="pageLabel" title="Fit this page in the window">Page 1 of 1</button>
      <button data-page="next" title="Next page (Page Down)"></button>
      <button data-page="add" title="Add a page"></button>
      <button data-page="more" title="More page actions"></button>
    </div>

    <div id="zoombar">
      <button data-cmd="zoomOut" title="Zoom out"></button>
      <button id="zoomLabel" title="Reset zoom">100%</button>
      <button data-cmd="zoomIn" title="Zoom in"></button>
      <button data-cmd="fit" title="Fit to board"></button>
    </div>

    <div id="hints" aria-live="polite"></div>
    <button id="hiddenPill" class="stage-floating-pill stage-hidden-pill" type="button" hidden></button>
    <button id="zenPill" class="stage-floating-pill stage-zen-pill" type="button" hidden></button>
    <div id="zoomPill" aria-live="polite"></div>
    <div id="toasts"></div>
  </main>

  <aside class="panel" id="panel">
    <header>
      <h3 id="panelTitle">Panel</h3>
      <div id="panelActions"></div>
      <button class="icon-btn" id="panelClose" title="Close"></button>
    </header>
    <div class="body" id="panelBody"></div>
  </aside>

  <div id="overlay"><div class="card" id="overlayCard"></div></div>
</div>

<script src="js/platform/tauri-board.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
